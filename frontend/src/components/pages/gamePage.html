<html lang="en">

    }

    .title { background: #e3f2fd; }
    .description { background: #fce4ec; }

    .correct { border-color: green; }
    .wrong { border-color: red; }
  </style>
</head>
<body>

<script>
/***********************

  // Future API example:

  return [

    { id: 3, title: "Title TBD 3", description: "Description TBD 3" },
    { id: 4, title: "Title TBD 4", description: "Description TBD 4" },
    { id: 5, title: "Title TBD 5", description: "Description TBD 5" }
  ];
}

/***********************
 * CREATE BOXES
 ***********************/
function createBox(text, type, id, x, y) {
  const box = document.createElement('div');
  box.className = `box ${type}`;
  box.textContent = text;
  box.style.left = x + 'px';
  box.style.top = y + 'px';
  box.dataset.id = id; // key for matching

  makeDraggable(box);

  // Drop matching logic
  box.addEventListener('mouseup', () => {
    checkMatch(box);
  });

  document.body.appendChild(box);
}

/***********************
 * DRAG FUNCTIONALITY
 ***********************/
function makeDraggable(element) {
  let offsetX = 0, offsetY = 0, isDragging = false;

  element.addEventListener('mousedown', (e) => {
    isDragging = true;
    offsetX = e.clientX - element.offsetLeft;
    offsetY = e.clientY - element.offsetTop;
  });

  document.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    element.style.left = (e.clientX - offsetX) + 'px';
    element.style.top = (e.clientY - offsetY) + 'px';
  });

  document.addEventListener('mouseup', () => {
    isDragging = false;
  });
}

/***********************
 * MATCH CHECKING
 ***********************/
function checkMatch(draggedBox) {
  const boxes = document.querySelectorAll('.box');

  boxes.forEach(otherBox => {
    if (draggedBox === otherBox) return;

    const rect1 = draggedBox.getBoundingClientRect();
    const rect2 = otherBox.getBoundingClientRect();

    const overlap = !(
      rect1.right < rect2.left ||
      rect1.left > rect2.right ||
      rect1.bottom < rect2.top ||
      rect1.top > rect2.bottom
    );

    if (overlap) {
      if (
        draggedBox.dataset.id === otherBox.dataset.id &&
        draggedBox.classList.contains('title') !== otherBox.classList.contains('title')
      ) {
        // ✅ MATCH → fade out then remove both
        draggedBox.style.transition = 'opacity 0.3s';
        otherBox.style.transition = 'opacity 0.3s';

        draggedBox.style.opacity = '0';
        otherBox.style.opacity = '0';

        setTimeout(() => {
          draggedBox.remove();
          otherBox.remove();
        }, 300);

      } else {
        // ❌ WRONG MATCH
        draggedBox.classList.add('wrong');
        setTimeout(() => draggedBox.classList.remove('wrong'), 500);
      }
    }
  });
}

/***********************
 * INIT APP
 ***********************/
async function init() {
  const data = await fetchFlashcards();

  data.forEach((item, index) => {
    createBox(item.title, 'title', item.id, 50, 50 + index * 90);
    createBox(item.description, 'description', item.id, 350, 50 + index * 90);
  });
}

init();
</script>
